<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>XO - لعبة إكس أو</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>❌ XO ⭕</h1>
      <div class="mode-toggle">
        <button id="modePvP" class="active">👥 لاعبين</button>
        <button id="modeAI">🤖 ذكاء اصطناعي</button>
      </div>
    </header>

    <div class="scoreboard">
      <div class="score x"><span class="label">X</span><span id="scoreX">0</span></div>
      <div class="score draw"><span class="label">تعادل</span><span id="scoreDraw">0</span></div>
      <div class="score o"><span class="label">O</span><span id="scoreO">0</span></div>
    </div>

    <div class="turn" id="turn">دور <b>X</b></div>

    <div class="board" id="board"></div>

    <button class="reset" id="reset">🔄 لعبة جديدة</button>
    <p class="hint">💡 نصيحة: اضغط "إضافة للشاشة الرئيسية" من قائمة المتصفح</p>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <h2 id="modalText">X فاز!</h2>
      <button id="modalClose">يلا كمان مرة</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
